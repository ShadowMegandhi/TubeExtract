name: Release

# Push a tag like v0.1.0 to build everything and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: Test helper
        working-directory: helper
        run: go test ./...
      - name: Build helper binaries
        working-directory: helper
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../release/$3" .
          }
          build windows amd64 tubeextract-helper-windows-x64.exe
          build darwin  arm64 tubeextract-helper-macos-apple-silicon
          build darwin  amd64 tubeextract-helper-macos-intel
          build linux   amd64 tubeextract-helper-linux-x64
          build linux   arm64 tubeextract-helper-linux-arm64

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "TubeExtract $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
