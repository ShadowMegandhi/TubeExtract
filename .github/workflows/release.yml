name: Release

# Fully automatic: every push to main whose manifest version has no release yet
# gets built, tagged and published. Bump the version (npm run bump), commit, push.
# Pushing a v* tag by hand still works too.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this version needs a release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./public/manifest.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip == 'false'
        run: npm ci
      - if: steps.ver.outputs.skip == 'false'
        run: npm test
      - if: steps.ver.outputs.skip == 'false'
        run: npm run build
      - if: steps.ver.outputs.skip == 'false'
        run: npm run zip

      - if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - if: steps.ver.outputs.skip == 'false'
        name: Test helper
        working-directory: helper
        run: go test ./...
      - if: steps.ver.outputs.skip == 'false'
        name: Build helper binaries
        working-directory: helper
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          build() {
            GOOS=$1 GOARCH=$2 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../release/$3" .
          }
          build windows amd64 tubeextract-helper-windows-x64.exe
          build darwin  arm64 tubeextract-helper-macos-apple-silicon
          build darwin  amd64 tubeextract-helper-macos-intel
          build linux   amd64 tubeextract-helper-linux-x64
          build linux   arm64 tubeextract-helper-linux-arm64

      - if: steps.ver.outputs.skip == 'false'
        name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - if: steps.ver.outputs.skip == 'false'
        name: Publish release (creates the tag too)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "TubeExtract $TAG" \
            --notes-file .github/release-notes.md
